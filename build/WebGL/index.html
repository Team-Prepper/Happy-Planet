<!DOCTYPE html>
<html lang="en-us">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Happy Planet</title>
  <style>
    canvas {
      position: absoulte;
    }

    body>div {
      position: relative !important;
    }

    input,
    textarea,
    select {
      font-size: 16px;
    }
  </style>
</head>

<body style="text-align: center; padding: 0; border: 0; margin: 0;">
  <div style="height:100vh;">
    <canvas id="unity-canvas" width=600 height=960 style="width: 100%; height: 100%"></canvas>
  </div>
  <script src="Build/WebGL.loader.js"></script>
  <script>

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      // Mobile device style: fill the whole browser client area with the game canvas:
      var meta = document.createElement('meta');
      meta.name = 'viewport';
      meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
      document.getElementsByTagName('head')[0].appendChild(meta);

      var canvas = document.querySelector("#unity-canvas");
      canvas.style.width = "100%";
      canvas.style.height = "100%";
      canvas.style.position = "fixed";

      document.body.style.textAlign = "left";
    }

    var buildUrl = "Build";
    var config = {
      dataUrl: buildUrl + "/WebGL.data",
      frameworkUrl: buildUrl + "/WebGL.framework.js",
      codeUrl: buildUrl + "/WebGL.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "hash6799fa",
      productName: "HappyPlanet",
      productVersion: "0.1.8",
    };

    createUnityInstance(document.querySelector("#unity-canvas"), config).then((unityInstance) => {
      window.unityInstance = unityInstance;
    }).catch((message) => {
      alert(message);
    });

  </script>
  <script src="https://www.gstatic.com/firebasejs/10.7.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.2/firebase-database-compat.js"></script>
</body>

</html>
