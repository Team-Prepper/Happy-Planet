name: Build WebGL and Deploy to itch.io

on:
  push:
    branches:
      - deploy
  workflow_dispatch:

concurrency:
  group: webgl-itch-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UNITY_PROJECT_PATH: Happy Planet
  BUILD_PATH: build
  BUILD_NAME: WebGL
  ITCH_CHANNEL: webgl

jobs:
  build-webgl:
    name: Build WebGL
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Check local Firebase packages
        run: |
          test -f "${UNITY_PROJECT_PATH}/GooglePackages/com.google.external-dependency-manager-1.2.186.tgz"
          test -f "${UNITY_PROJECT_PATH}/GooglePackages/com.google.firebase.app-13.6.0.tgz"
          test -f "${UNITY_PROJECT_PATH}/GooglePackages/com.google.firebase.auth-13.6.0.tgz"
          test -f "${UNITY_PROJECT_PATH}/GooglePackages/com.google.firebase.database-13.6.0.tgz"
          test -f "${UNITY_PROJECT_PATH}/GooglePackages/com.google.firebase.firestore-13.6.0.tgz"

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: ${{ env.UNITY_PROJECT_PATH }}/Library
          key: Library-${{ runner.os }}-${{ env.UNITY_PROJECT_PATH }}-WebGL-${{ hashFiles('Happy Planet/Packages/manifest.json', 'Happy Planet/Packages/packages-lock.json', 'Happy Planet/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-${{ runner.os }}-${{ env.UNITY_PROJECT_PATH }}-WebGL-
            Library-${{ runner.os }}-${{ env.UNITY_PROJECT_PATH }}-

      - name: Build WebGL player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.UNITY_PROJECT_PATH }}
          targetPlatform: WebGL
          buildsPath: ${{ env.BUILD_PATH }}
          buildName: ${{ env.BUILD_NAME }}

      - name: Upload WebGL build artifact
        uses: actions/upload-artifact@v4
        with:
          name: HappyPlanet-WebGL
          path: ${{ env.BUILD_PATH }}/${{ env.BUILD_NAME }}
          if-no-files-found: error

  deploy-itch:
    name: Deploy to itch.io
    runs-on: ubuntu-latest
    needs: build-webgl
    if: github.ref == 'refs/heads/deploy'

    steps:
      - name: Download WebGL build artifact
        uses: actions/download-artifact@v4
        with:
          name: HappyPlanet-WebGL
          path: ${{ env.BUILD_PATH }}/${{ env.BUILD_NAME }}

      - name: Install butler
        run: |
          curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip
          chmod +x butler

      - name: Deploy WebGL build to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_USER: ${{ vars.ITCH_USER }}
          ITCH_GAME: ${{ vars.ITCH_GAME }}
        run: |
          test -n "${BUTLER_API_KEY}"
          test -n "${ITCH_USER}"
          test -n "${ITCH_GAME}"
          ./butler push "${BUILD_PATH}/${BUILD_NAME}" "${ITCH_USER}/${ITCH_GAME}:${ITCH_CHANNEL}" --userversion "${GITHUB_SHA::7}"
