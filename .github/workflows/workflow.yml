name: Build WebGL and Deploy to itch.io

on:
  push:
    branches:
      - deploy
  workflow_dispatch:

concurrency:
  group: webgl-itch-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build WebGL and deploy to itch.io
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build WebGL and deploy to itch.io
        uses: Easy-H/unity-webgl-itch@v0.0.1
        with:
          unity-project-path: Happy Planet
          build-path: build
          build-name: WebGL
          itch-channel: webgl
          unity-license: ${{ secrets.UNITY_LICENSE }}
          unity-email: ${{ secrets.UNITY_EMAIL }}
          unity-password: ${{ secrets.UNITY_PASSWORD }}
          butler-api-key: ${{ secrets.BUTLER_API_KEY }}
          itch-user: ${{ vars.ITCH_USER }}
          itch-game: ${{ vars.ITCH_GAME }}
